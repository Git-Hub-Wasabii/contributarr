name: Validate and publish GHCR image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Python tests and Docker validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]{2})\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Release tags must use vYY.MM.DD or vYY.MM.DD.N (N starts at 1)."
            exit 1
          fi
          release_date="20${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          parsed_date="$(date --utc --date "$release_date" +%F 2>/dev/null)" || {
            echo "::error::Release tag contains an invalid calendar date: $tag"
            exit 1
          }
          if [[ "$parsed_date" != "$release_date" ]]; then
            echo "::error::Release tag contains an invalid calendar date: $tag"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker image build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: contributarr:ci
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

      - name: Smoke-test container health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs contributarr-smoke || true
            docker rm --force contributarr-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name contributarr-smoke \
            --publish 127.0.0.1:9096:9096 \
            contributarr:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:9096/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  publish:
    name: Publish multi-platform image
    needs: validate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize GHCR image name
        id: image
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing release tag
        shell: bash
        run: |
          set +e
          inspect_output="$(docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}" 2>&1)"
          inspect_status=$?
          set -e
          if [[ $inspect_status -eq 0 ]]; then
            echo "::error::${GITHUB_REF_NAME} already exists in GHCR. Release tags are immutable; create a new CalVer tag instead."
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|name unknown' <<<"$inspect_output"; then
            echo "::error::Could not safely verify that ${GITHUB_REF_NAME} is unused in GHCR. Refusing to publish."
            echo "$inspect_output"
            exit 1
          fi

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
